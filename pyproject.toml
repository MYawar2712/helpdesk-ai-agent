[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "helpdesk-ai-agent"
version = "0.1.0"
description = "A typed foundation for a helpdesk AI agent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3,<1",
    "langgraph>=0.2,<2",
    "langgraph-checkpoint>=2.1,<5",
    "langgraph-checkpoint-postgres>=2.0.25,<4",
    "langgraph-checkpoint-sqlite>=2.0.11,<4",
    "psycopg[binary]>=3.1,<4",
    "langchain-openai>=0.2,<1",
    "langchain-chroma>=0.1,<1",
    "chromadb>=0.5,<2",
    "langsmith>=0.1,<1",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "psycopg2-binary>=2.9,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
per-file-ignores = { "_migrate_tests.py" = ["E501"] }
